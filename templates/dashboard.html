<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-slate-50 via-gray-100 to-indigo-50 min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-xl space-y-6">

        <!-- Top Header Card -->
        <div class="bg-white rounded-3xl p-6 shadow-xl border border-gray-100 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <img id="user-avatar" src="https://ui-avatars.com/api/?name=User&background=4f46e5&color=fff&size=128" class="w-16 h-16 rounded-2xl object-cover border-2 border-indigo-100 shadow">
                <div>
                    <h1 class="text-xl font-black text-gray-800" id="user-name">Employee Name</h1>
                    <p class="text-xs text-gray-500 font-mono mt-0.5">ID: <span id="user-id" class="font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md"></span></p>
                </div>
            </div>
            <div>
                <button onclick="window.location.href='/'" class="text-gray-400 hover:text-gray-600 p-2 text-sm" title="Home">
                    <i class="fas fa-home text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Attendance & Live Time Status Card -->
        <div class="bg-white rounded-3xl p-6 shadow-xl border border-gray-100">
            <div class="flex items-center justify-between pb-4 border-b border-gray-100">
                <div class="flex items-center space-x-3">
                    <span id="status-indicator" class="w-4 h-4 rounded-full bg-gray-400 animate-pulse"></span>
                    <span id="status-text" class="font-bold text-gray-700 text-sm">Checking Status...</span>
                </div>
                <div class="text-right">
                    <span id="live-clock" class="text-xs font-mono font-bold text-gray-500"></span>
                </div>
            </div>

            <!-- Time & Work Hours Details -->
            <div class="grid grid-cols-2 gap-4 my-6">
                <div class="bg-indigo-50/70 p-4 rounded-2xl border border-indigo-100">
                    <p class="text-[11px] font-bold uppercase text-indigo-500 tracking-wider">Login Time</p>
                    <p class="text-lg font-black text-indigo-900 mt-1" id="login-time-display">--:-- --</p>
                </div>
                <div class="bg-emerald-50/70 p-4 rounded-2xl border border-emerald-100">
                    <p class="text-[11px] font-bold uppercase text-emerald-600 tracking-wider">Work Duration</p>
                    <p class="text-lg font-black text-emerald-900 mt-1" id="work-hours-display">--</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="space-y-3">
                <button id="logout-btn" onclick="logout()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-rose-200 transition-all flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-sign-out-alt mr-2"></i> Clock Out / Logout
                </button>
            </div>
            <p id="message" class="mt-3 text-center text-xs font-semibold"></p>
        </div>

        <!-- Employee Lifetime Work Stats (Days & Total Hours Worked) -->
        <div class="bg-white rounded-3xl p-6 shadow-xl border border-gray-100">
            <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3 flex items-center">
                <i class="fas fa-chart-line text-indigo-500 mr-2"></i> My Total Work Summary
            </h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center text-lg">
                        <i class="fas fa-calendar-check"></i>
                    </div>
                    <div>
                        <p class="text-[11px] font-bold text-gray-500 uppercase">Total Days</p>
                        <h4 class="text-xl font-black text-gray-800" id="total-days-worked">0 Days</h4>
                    </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg">
                        <i class="fas fa-hourglass-half"></i>
                    </div>
                    <div>
                        <p class="text-[11px] font-bold text-gray-500 uppercase">Total Hours</p>
                        <h4 class="text-xl font-black text-gray-800" id="total-hours-worked">0h 0m</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions: Apply Leave & Office Messages -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="openLeaveModal()" class="bg-white hover:bg-indigo-50/50 p-5 rounded-3xl shadow-lg border border-gray-100 text-left transition group">
                <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center mb-3 text-lg group-hover:scale-110 transition">
                    <i class="fas fa-calendar-minus"></i>
                </div>
                <h3 class="font-bold text-gray-800 text-sm">Apply Leave</h3>
                <p class="text-[11px] text-gray-400 mt-0.5">Half day or full day request</p>
            </button>

            <button onclick="scrollToMessages()" class="bg-white hover:bg-indigo-50/50 p-5 rounded-3xl shadow-lg border border-gray-100 text-left transition group">
                <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center mb-3 text-lg group-hover:scale-110 transition">
                    <i class="fas fa-bullhorn"></i>
                </div>
                <h3 class="font-bold text-gray-800 text-sm">Office Messages</h3>
                <p class="text-[11px] text-gray-400 mt-0.5" id="messages-count-badge">Notices from Admin</p>
            </button>
        </div>

        <!-- Office Messages / Notice Board Section -->
        <div id="messages-section" class="bg-white rounded-3xl p-6 shadow-xl border border-gray-100">
            <div class="flex items-center justify-between mb-4 pb-2 border-b">
                <h2 class="text-base font-bold text-gray-800 flex items-center">
                    <i class="fas fa-envelope-open-text text-indigo-600 mr-2"></i> Office Messages
                </h2>
                <button onclick="loadUserMessages()" class="text-xs text-indigo-600 hover:underline">Refresh</button>
            </div>
            <div id="messages-container" class="space-y-3 max-h-60 overflow-y-auto">
                <p class="text-xs text-gray-400 text-center py-4">No new notices.</p>
            </div>
        </div>

        <!-- My Recent Leaves Status Section -->
        <div class="bg-white rounded-3xl p-6 shadow-xl border border-gray-100">
            <h2 class="text-base font-bold text-gray-800 mb-3 flex items-center">
                <i class="fas fa-history text-amber-500 mr-2"></i> My Leave History
            </h2>
            <div id="leaves-container" class="space-y-2.5 max-h-48 overflow-y-auto text-xs">
                <p class="text-gray-400 text-center py-2">No leave applications yet.</p>
            </div>
        </div>

        <!-- My Attendance Logs History -->
        <div class="bg-white rounded-3xl p-6 shadow-xl border border-gray-100">
            <h2 class="text-base font-bold text-gray-800 mb-3 flex items-center justify-between">
                <span class="flex items-center"><i class="fas fa-calendar-alt text-indigo-500 mr-2"></i> Attendance Log History</span>
                <button onclick="loadWorkSummary()" class="text-xs text-indigo-600 hover:underline">Refresh</button>
            </h2>
            <div id="attendance-history-container" class="space-y-2.5 max-h-56 overflow-y-auto text-xs">
                <p class="text-gray-400 text-center py-2">Loading attendance records...</p>
            </div>
        </div>

    </div>

    <!-- Apply Leave Modal -->
    <div id="leave-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl border border-gray-100">
            <div class="flex items-center justify-between pb-3 border-b mb-4">
                <h3 class="text-lg font-black text-gray-800">Apply for Leave</h3>
                <button onclick="closeLeaveModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>

            <!-- Leave Type 3 Buttons -->
            <label class="block text-xs font-bold text-gray-600 uppercase mb-2">Select Leave Type *</label>
            <div class="grid grid-cols-3 gap-2 mb-4">
                <button type="button" onclick="selectLeaveType('First Half Day')" class="leave-btn border-2 border-gray-200 py-2.5 rounded-xl text-xs font-bold hover:border-indigo-600 transition text-center" id="btn-first-half">
                    First Half
                </button>
                <button type="button" onclick="selectLeaveType('Second Half Day')" class="leave-btn border-2 border-gray-200 py-2.5 rounded-xl text-xs font-bold hover:border-indigo-600 transition text-center" id="btn-second-half">
                    Second Half
                </button>
                <button type="button" onclick="selectLeaveType('Full Day')" class="leave-btn border-2 border-gray-200 py-2.5 rounded-xl text-xs font-bold hover:border-indigo-600 transition text-center" id="btn-full-day">
                    Full Day
                </button>
            </div>

            <div class="mb-3.5">
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Leave Date *</label>
                <input type="date" id="leave-date" class="w-full p-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Reason / Message *</label>
                <textarea id="leave-message" rows="3" placeholder="Please mention the reason for leave..." class="w-full p-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            </div>

            <div class="flex space-x-3">
                <button onclick="submitLeave()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
                    Send Request
                </button>
                <button onclick="closeLeaveModal()" class="px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition">
                    Cancel
                </button>
            </div>
            <p id="leave-msg-alert" class="mt-2 text-xs text-center font-semibold text-rose-500"></p>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = '/';
        }

        document.getElementById('user-name').innerText = user.name || 'Employee';
        document.getElementById('user-id').innerText = user.user_id || '------';
        if (user.profile_image) {
            document.getElementById('user-avatar').src = user.profile_image;
        }

        let selectedLeaveType = 'Full Day';
        let loginTimestamp = null;
        let timerInterval = null;

        // Live Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString();
        }, 1000);

        function showMessage(msg, isSuccess = false) {
            const el = document.getElementById('message');
            el.innerText = msg;
            el.className = `mt-3 text-center text-xs font-semibold ${isSuccess ? 'text-emerald-600' : 'text-rose-600'}`;
        }

        async function checkStatus() {
            try {
                const res = await fetch(`/api/status/${user.user_id}`);
                const data = await res.json();

                const indicator = document.getElementById('status-indicator');
                const text = document.getElementById('status-text');
                const logoutBtn = document.getElementById('logout-btn');
                const loginTimeEl = document.getElementById('login-time-display');
                const workHoursEl = document.getElementById('work-hours-display');

                if (data.status === 'green') {
                    indicator.className = 'w-4 h-4 rounded-full bg-emerald-500 shadow-[0_0_10px_#10b981]';
                    text.innerText = 'Active (Clocked In)';
                    logoutBtn.disabled = false;
                    loginTimeEl.innerText = data.login_time || '--';
                    startLiveTimer(data.login_time);
                } else if (data.status === 'red') {
                    indicator.className = 'w-4 h-4 rounded-full bg-rose-500 shadow-[0_0_10px_#f43f5e]';
                    text.innerText = 'Clocked Out';
                    logoutBtn.disabled = true;
                    loginTimeEl.innerText = data.login_time || '--';
                    workHoursEl.innerText = data.work_hours || '--';
                    if (timerInterval) clearInterval(timerInterval);
                } else {
                    indicator.className = 'w-4 h-4 rounded-full bg-gray-400';
                    text.innerText = 'Not Clocked In Today';
                    logoutBtn.disabled = true;
                    loginTimeEl.innerText = '--';
                    workHoursEl.innerText = '--';
                    if (timerInterval) clearInterval(timerInterval);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function startLiveTimer(loginTimeStr) {
            if (timerInterval) clearInterval(timerInterval);
            if (!loginTimeStr) return;

            // Update work hours live every second
            function updateTimer() {
                try {
                    const now = new Date();
                    // parse loginTimeStr like "09:30:15 AM"
                    const parts = loginTimeStr.match(/(\d+):(\d+):(\d+)\s*(AM|PM)?/i);
                    if (!parts) return;
                    let h = parseInt(parts[1]);
                    const m = parseInt(parts[2]);
                    const s = parseInt(parts[3]);
                    const ampm = parts[4];
                    if (ampm && ampm.toUpperCase() === 'PM' && h < 12) h += 12;
                    if (ampm && ampm.toUpperCase() === 'AM' && h === 12) h = 0;

                    const loginDate = new Date();
                    loginDate.setHours(h, m, s, 0);

                    let diffSec = Math.floor((now - loginDate) / 1000);
                    if (diffSec < 0) diffSec += 24 * 3600;

                    const hrs = Math.floor(diffSec / 3600);
                    const mins = Math.floor((diffSec % 3600) / 60);
                    const secs = diffSec % 60;
                    document.getElementById('work-hours-display').innerText = `${hrs}h ${mins}m ${secs}s`;
                } catch(e) {}
            }
            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }

        async function logout() {
            showMessage('Capturing location and checking out...', true);
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    await doLogout(position.coords.latitude, position.coords.longitude);
                },
                async (error) => {
                    console.warn("Logout location error:", error);
                    await doLogout(null, null);
                },
                { enableHighAccuracy: true, timeout: 6000 }
            );
        }

        async function doLogout(lat, lng) {
            try {
                const res = await fetch('/api/logout', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: user.user_id, lat, lng})
                });
                const data = await res.json();
                if (data.success) {
                    showMessage(`Logged out successfully! Total: ${data.work_hours}`, true);
                    checkStatus();
                }
            } catch (e) {
                showMessage('Server error during logout.');
            }
        }

        // Leave Management
        function openLeaveModal() {
            document.getElementById('leave-date').value = new Date().toISOString().split('T')[0];
            selectLeaveType('Full Day');
            document.getElementById('leave-modal').classList.remove('hidden');
            document.getElementById('leave-modal').classList.add('flex');
        }

        function closeLeaveModal() {
            document.getElementById('leave-modal').classList.add('hidden');
            document.getElementById('leave-modal').classList.remove('flex');
            document.getElementById('leave-msg-alert').innerText = '';
        }

        function selectLeaveType(type) {
            selectedLeaveType = type;
            document.querySelectorAll('.leave-btn').forEach(b => {
                b.classList.remove('border-indigo-600', 'bg-indigo-50', 'text-indigo-600');
                b.classList.add('border-gray-200', 'text-gray-700');
            });
            if (type === 'First Half Day') {
                const el = document.getElementById('btn-first-half');
                el.classList.add('border-indigo-600', 'bg-indigo-50', 'text-indigo-600');
            } else if (type === 'Second Half Day') {
                const el = document.getElementById('btn-second-half');
                el.classList.add('border-indigo-600', 'bg-indigo-50', 'text-indigo-600');
            } else {
                const el = document.getElementById('btn-full-day');
                el.classList.add('border-indigo-600', 'bg-indigo-50', 'text-indigo-600');
            }
        }

        async function submitLeave() {
            const dateVal = document.getElementById('leave-date').value;
            const messageVal = document.getElementById('leave-message').value.trim();
            if (!messageVal) {
                document.getElementById('leave-msg-alert').innerText = 'Please write a message/reason.';
                return;
            }

            try {
                const res = await fetch('/api/leave/apply', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: user.user_id,
                        name: user.name,
                        leave_type: selectedLeaveType,
                        date: dateVal,
                        message: messageVal
                    })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Leave request submitted successfully!');
                    closeLeaveModal();
                    loadMyLeaves();
                } else {
                    document.getElementById('leave-msg-alert').innerText = data.error || 'Failed to submit.';
                }
            } catch (e) {
                document.getElementById('leave-msg-alert').innerText = 'Network error.';
            }
        }

        async function loadMyLeaves() {
            try {
                const res = await fetch(`/api/leave/my-leaves/${user.user_id}`);
                const list = await res.json();
                const container = document.getElementById('leaves-container');
                if (list.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-center py-2">No leave applications yet.</p>';
                    return;
                }
                container.innerHTML = list.map(l => {
                    let badge = 'bg-amber-100 text-amber-700';
                    if (l.status === 'Approved') badge = 'bg-emerald-100 text-emerald-700';
                    if (l.status === 'Rejected') badge = 'bg-rose-100 text-rose-700';
                    return `
                        <div class="bg-gray-50 p-3 rounded-2xl flex items-center justify-between border border-gray-100">
                            <div>
                                <span class="font-bold text-gray-800">${l.leave_type}</span>
                                <span class="text-gray-400 ml-1">(${l.date})</span>
                                <p class="text-[11px] text-gray-500 mt-0.5 truncate max-w-xs">${l.message || ''}</p>
                            </div>
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${badge}">${l.status}</span>
                        </div>
                    `;
                }).join('');
            } catch (e) {}
        }

        async function loadUserMessages() {
            try {
                const res = await fetch(`/api/messages/${user.user_id}`);
                const list = await res.json();
                const container = document.getElementById('messages-container');
                document.getElementById('messages-count-badge').innerText = `${list.length} Notice(s)`;
                if (list.length === 0) {
                    container.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">No new notices.</p>';
                    return;
                }
                container.innerHTML = list.map(m => `
                    <div class="bg-indigo-50/50 p-3.5 rounded-2xl border border-indigo-100">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-indigo-900 text-xs">${m.title || 'Office Notice'}</span>
                            <span class="text-[10px] text-gray-400">${m.date || ''}</span>
                        </div>
                        <p class="text-xs text-gray-700 mt-1 whitespace-pre-wrap">${m.message}</p>
                        <p class="text-[10px] text-indigo-500 font-semibold mt-1">From: ${m.from_name || 'Admin'}</p>
                    </div>
                `).join('');
            } catch (e) {}
        }

        function scrollToMessages() {
            document.getElementById('messages-section').scrollIntoView({ behavior: 'smooth' });
        }

        async function loadWorkSummary() {
            try {
                const res = await fetch(`/api/employee/work-summary/${user.user_id}`);
                const data = await res.json();
                document.getElementById('total-days-worked').innerText = `${data.total_days} Days`;
                document.getElementById('total-hours-worked').innerText = data.total_hours;

                const container = document.getElementById('attendance-history-container');
                if (!data.records || data.records.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-center py-2">No past records found.</p>';
                    return;
                }
                container.innerHTML = data.records.map(r => {
                    const statusBadge = r.status === 'green' ? '<span class="text-emerald-600 font-bold">Active</span>' : '<span class="text-slate-500 font-bold">Checked Out</span>';
                    const dur = r.work_hours && r.work_hours !== '-' ? `<span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-mono font-bold">${r.work_hours}</span>` : '-';
                    const mapIn = (r.login_lat && r.login_lng) ? `<a href="https://maps.google.com/?q=${r.login_lat},${r.login_lng}" target="_blank" class="text-rose-500 hover:text-rose-700 ml-1 inline-flex items-center" title="View Check In Location on Map"><i class="fas fa-location-dot text-[11px]"></i></a>` : '';
                    const mapOut = (r.logout_lat && r.logout_lng) ? `<a href="https://maps.google.com/?q=${r.logout_lat},${r.logout_lng}" target="_blank" class="text-rose-500 hover:text-rose-700 ml-1 inline-flex items-center" title="View Check Out Location on Map"><i class="fas fa-location-dot text-[11px]"></i></a>` : '';
                    return `
                        <div class="bg-gray-50 p-3 rounded-2xl flex items-center justify-between border border-gray-100">
                            <div>
                                <span class="font-bold text-gray-800">${r.date}</span>
                                <div class="text-[11px] text-gray-500 mt-0.5 space-x-2">
                                    <span>In: <b class="text-gray-700">${r.login_time || '-'}</b>${mapIn}</span>
                                    <span>Out: <b class="text-gray-700">${r.logout_time || '-'}</b>${mapOut}</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <div>${dur}</div>
                                <div class="text-[10px] mt-0.5">${statusBadge}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch(e) {}
        }

        // Initialize
        checkStatus();
        loadMyLeaves();
        loadUserMessages();
        loadWorkSummary();
    </script>
</body>
</html>
