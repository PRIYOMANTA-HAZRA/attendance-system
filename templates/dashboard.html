<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-r from-gray-50 to-gray-200 h-screen flex flex-col items-center justify-center">

    <div class="bg-white p-10 rounded-2xl shadow-2xl w-[400px] text-center border-t-4 border-blue-600">
        <div class="mb-4">
            <i class="fas fa-user-circle text-6xl text-gray-400"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">My Dashboard</h1>
        
        <div class="my-6 bg-gray-50 p-4 rounded-lg shadow-inner">
            <p class="text-lg text-gray-600">Welcome, <span id="user-name" class="font-extrabold text-blue-600"></span>!</p>
            <p class="text-sm text-gray-500 mt-1">ID: <span id="user-id" class="font-mono bg-gray-200 px-2 py-1 rounded"></span></p>
        </div>

        <div class="my-6 flex items-center justify-center bg-gray-50 py-3 rounded-full border border-gray-100 shadow-sm">
            <span id="status-indicator" class="inline-block w-4 h-4 rounded-full bg-gray-400 mr-3 animate-pulse"></span>
            <span id="status-text" class="text-gray-700 font-medium tracking-wide">Loading Status...</span>
        </div>

        <div class="flex flex-col space-y-3 mt-8">
            <button onclick="logout()" class="w-full bg-rose-500 text-white font-bold py-3 rounded-lg shadow-md hover:bg-rose-600 hover:shadow-lg transition-all flex justify-center items-center" id="logout-btn">
                <i class="fas fa-sign-out-alt mr-2"></i> Log Out
            </button>
            <button onclick="window.location.href='/'" class="w-full bg-gray-200 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-300 transition-all">
                <i class="fas fa-home mr-2"></i> Home
            </button>
        </div>
        
        <p id="message" class="mt-4 text-center font-medium"></p>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if(!user) {
            window.location.href = '/';
        }

        document.getElementById('user-name').innerText = user.name;
        document.getElementById('user-id').innerText = user.user_id;

        function showMessage(msg, type='error') {
            const el = document.getElementById('message');
            el.innerText = msg;
            el.className = `mt-4 text-center text-sm font-medium ${type === 'error' ? 'text-red-500' : 'text-green-500'}`;
        }

        async function checkStatus() {
            try {
                const res = await fetch(`/api/status/${user.user_id}`);
                const data = await res.json();
                
                const indicator = document.getElementById('status-indicator');
                const text = document.getElementById('status-text');
                const logoutBtn = document.getElementById('logout-btn');
                const nameSpan = document.getElementById('user-name');

                if(data.status === 'green') {
                    indicator.className = 'inline-block w-4 h-4 rounded-full bg-green-500 mr-3 shadow-[0_0_8px_#22c55e]';
                    text.innerText = 'Active (Checked In)';
                    nameSpan.className = 'font-extrabold text-green-600';
                    logoutBtn.disabled = false;
                    logoutBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    indicator.className = 'inline-block w-4 h-4 rounded-full bg-red-500 mr-3 shadow-[0_0_8px_#ef4444]';
                    text.innerText = 'Inactive (Checked Out)';
                    nameSpan.className = 'font-extrabold text-red-600';
                    logoutBtn.disabled = true;
                    logoutBtn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            } catch(e) {
                console.error(e);
            }
        }

        async function logout() {
            showMessage('Fetching location to check out...', 'success');
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    await doLogout(position.coords.latitude, position.coords.longitude);
                },
                async (error) => {
                    await doLogout(null, null);
                },
                { timeout: 5000 }
            );
        }

        async function doLogout(lat, lng) {
            try {
                const res = await fetch('/api/logout', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: user.user_id, lat, lng})
                });
                const data = await res.json();
                
                if(data.success) {
                    showMessage('Successfully logged out!', 'success');
                    checkStatus();
                }
            } catch(e) {
                showMessage('Server Error');
            }
        }

        checkStatus();
    </script>
</body>
</html>
