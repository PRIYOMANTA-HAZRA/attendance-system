<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <div class="min-h-screen flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="bg-indigo-800 text-white w-full md:w-64 flex-shrink-0 flex flex-col shadow-2xl">
            <div class="p-6 text-center border-b border-indigo-700">
                <i class="fas fa-shield-alt text-4xl mb-2 text-indigo-300"></i>
                <h1 class="text-2xl font-bold tracking-wider">Admin Panel</h1>
                <p class="text-xs text-indigo-300 mt-1" id="admin-name"></p>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#overview" class="block py-2.5 px-4 rounded transition hover:bg-indigo-700 hover:text-white"><i class="fas fa-chart-pie mr-2"></i> Overview</a>
                <a href="#requests" class="block py-2.5 px-4 rounded transition hover:bg-indigo-700 hover:text-white"><i class="fas fa-user-plus mr-2"></i> Requests</a>
                <a href="#employees" class="block py-2.5 px-4 rounded transition hover:bg-indigo-700 hover:text-white"><i class="fas fa-users mr-2"></i> Employees</a>
                <a href="#attendance" class="block py-2.5 px-4 rounded transition hover:bg-indigo-700 hover:text-white"><i class="fas fa-calendar-check mr-2"></i> Attendance & Export</a>
            </nav>
            <div class="p-4 border-t border-indigo-700">
                <button onclick="window.location.href='/dashboard'" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 px-4 rounded transition">Employee View</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-8 overflow-y-auto">
            
            <!-- Overview Section -->
            <section id="overview" class="mb-12">
                <div class="flex justify-between items-center mb-6 border-b pb-2">
                    <h2 class="text-3xl font-bold text-gray-700">Overview</h2>
                    <span id="db-badge" class="px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-700 font-semibold border border-gray-300"><i class="fas fa-spinner fa-spin mr-1"></i> Checking DB...</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white rounded-xl shadow p-6 border-l-4 border-blue-500">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-500 text-sm font-semibold uppercase">Total Employees</p>
                                <h3 class="text-3xl font-bold text-gray-800" id="stat-employees">0</h3>
                            </div>
                            <i class="fas fa-users text-4xl text-blue-200"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl shadow p-6 border-l-4 border-orange-500">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-500 text-sm font-semibold uppercase">Pending Requests</p>
                                <h3 class="text-3xl font-bold text-gray-800" id="stat-requests">0</h3>
                            </div>
                            <i class="fas fa-user-clock text-4xl text-orange-200"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl shadow p-6 border-l-4 border-green-500">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-500 text-sm font-semibold uppercase">Registration Status</p>
                                <label class="relative inline-flex items-center cursor-pointer mt-2">
                                    <input type="checkbox" id="toggle-registration" class="sr-only peer" onchange="toggleReg()">
                                    <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div>
                                </label>
                                <p id="reg-status" class="text-xs text-gray-400 mt-1"></p>
                            </div>
                            <i class="fas fa-cog text-4xl text-green-200"></i>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Requests Section -->
            <section id="requests" class="mb-12">
                <h2 class="text-3xl font-bold mb-6 text-gray-700 border-b pb-2">Pending Requests</h2>
                <div class="bg-white shadow rounded-xl overflow-hidden">
                    <table class="min-w-full text-left">
                        <thead class="bg-gray-50 text-gray-600">
                            <tr>
                                <th class="py-3 px-6 font-semibold">Name</th>
                                <th class="py-3 px-6 font-semibold">Role</th>
                                <th class="py-3 px-6 font-semibold text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="requests-tbody" class="divide-y divide-gray-200">
                            <!-- populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Employees Section -->
            <section id="employees" class="mb-12">
                <h2 class="text-3xl font-bold mb-6 text-gray-700 border-b pb-2">Employees</h2>
                <div class="bg-white shadow rounded-xl overflow-hidden">
                    <table class="min-w-full text-left">
                        <thead class="bg-gray-50 text-gray-600">
                            <tr>
                                <th class="py-3 px-6 font-semibold">ID</th>
                                <th class="py-3 px-6 font-semibold">Name</th>
                                <th class="py-3 px-6 font-semibold">Role</th>
                                <th class="py-3 px-6 font-semibold text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="employees-tbody" class="divide-y divide-gray-200">
                            <!-- populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Attendance & Export Section -->
            <section id="attendance" class="mb-12">
                <h2 class="text-3xl font-bold mb-6 text-gray-700 border-b pb-2">Attendance & Export</h2>
                
                <div class="bg-white p-6 rounded-xl shadow mb-6 flex flex-wrap gap-4 items-end">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Start Date</label>
                        <input type="date" id="start-date" class="border border-gray-300 rounded p-2 focus:ring focus:ring-indigo-200">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">End Date</label>
                        <input type="date" id="end-date" class="border border-gray-300 rounded p-2 focus:ring focus:ring-indigo-200">
                    </div>
                    <div>
                        <button onclick="loadAttendance()" class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded hover:bg-indigo-200 transition font-semibold"><i class="fas fa-filter mr-1"></i> Filter</button>
                    </div>
                    <div class="ml-auto">
                        <button onclick="exportExcel()" class="bg-green-600 text-white px-6 py-2 rounded shadow hover:bg-green-700 transition font-bold"><i class="fas fa-file-excel mr-2"></i> Export to Excel</button>
                    </div>
                </div>

                <div id="attendance-container" class="space-y-6">
                    <!-- Data will be populated here -->
                </div>
            </section>

        </div>
    </div>

    <!-- Modal for Approval -->
    <div id="approve-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96 text-center">
            <div class="text-green-500 mb-4"><i class="fas fa-check-circle text-6xl"></i></div>
            <h2 class="text-2xl font-bold mb-2">Request Approved!</h2>
            <p class="text-gray-600 mb-4">Please give this ID to the employee:</p>
            <div class="bg-gray-100 p-4 rounded-lg font-mono text-3xl font-bold tracking-widest text-indigo-600 mb-6" id="approved-id"></div>
            <button onclick="closeModal()" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Done</button>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if(!user || (user.role !== 'owner' && user.role !== 'editor')) {
            alert('Unauthorized Access!');
            window.location.href = '/';
        }
        
        document.getElementById('admin-name').innerText = user.name;

        async function loadDashboard() {
            checkBackendStatus();
            loadSettings();
            loadStats();
            loadRequests();
            loadEmployees();
            loadAttendance();
        }

        async function checkBackendStatus() {
            try {
                const res = await fetch('/api/backend-status');
                const data = await res.json();
                const badge = document.getElementById('db-badge');
                if (data.firebase_active) {
                    badge.className = 'px-3 py-1 text-xs rounded-full bg-amber-100 text-amber-800 font-semibold border border-amber-300';
                    badge.innerHTML = '<i class="fas fa-fire mr-1 text-amber-500"></i> Google Firebase (Active)';
                } else {
                    badge.className = 'px-3 py-1 text-xs rounded-full bg-blue-100 text-blue-800 font-semibold border border-blue-300';
                    badge.innerHTML = '<i class="fas fa-database mr-1"></i> SQLite (Local)';
                }
            } catch(e) {}
        }

        async function loadSettings() {
            const res = await fetch('/api/settings');
            const data = await res.json();
            document.getElementById('toggle-registration').checked = data.allow_registration;
            document.getElementById('reg-status').innerText = data.allow_registration ? 'Open' : 'Closed';
        }

        async function toggleReg() {
            const checked = document.getElementById('toggle-registration').checked;
            await fetch('/api/settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({allow: checked})
            });
            document.getElementById('reg-status').innerText = checked ? 'Open' : 'Closed';
        }

        async function loadStats() {
            const res = await fetch('/api/admin/stats');
            const data = await res.json();
            document.getElementById('stat-employees').innerText = data.total_employees;
            document.getElementById('stat-requests').innerText = data.pending_requests;
        }

        async function loadRequests() {
            const res = await fetch('/api/admin/requests');
            const users = await res.json();
            const tbody = document.getElementById('requests-tbody');
            tbody.innerHTML = '';
            if(users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="py-4 px-6 text-center text-gray-500">No pending requests.</td></tr>';
                return;
            }
            users.forEach(u => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="py-3 px-6 font-medium text-gray-800">${u.name}</td>
                        <td class="py-3 px-6 text-gray-500 capitalize">${u.role}</td>
                        <td class="py-3 px-6 text-right">
                            <button onclick="approveRequest('${u.id}')" class="bg-green-100 text-green-700 px-3 py-1 rounded hover:bg-green-200"><i class="fas fa-check"></i> Approve</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function approveRequest(id) {
            const res = await fetch(`/api/admin/approve/${id}`, { method: 'POST' });
            const data = await res.json();
            if(data.success) {
                document.getElementById('approved-id').innerText = data.user_id;
                document.getElementById('approve-modal').classList.remove('hidden');
                loadStats();
                loadRequests();
                loadEmployees();
            }
        }

        function closeModal() {
            document.getElementById('approve-modal').classList.add('hidden');
        }

        async function loadEmployees() {
            const res = await fetch('/api/admin/users');
            const users = await res.json();
            const tbody = document.getElementById('employees-tbody');
            tbody.innerHTML = '';
            users.forEach(u => {
                let actions = '';
                if(user.role === 'owner' && u.role !== 'owner') {
                    const roleText = u.role === 'editor' ? 'Make Employee' : 'Make Editor';
                    const newRole = u.role === 'editor' ? 'employee' : 'editor';
                    const roleBtn = `<button onclick="changeRole('${u.id}', '${newRole}')" class="bg-blue-100 text-blue-700 px-3 py-1 rounded hover:bg-blue-200 mr-2"><i class="fas fa-user-edit"></i> ${roleText}</button>`;
                    const deleteBtn = `<button onclick="deleteUser('${u.id}')" class="bg-red-100 text-red-700 px-3 py-1 rounded hover:bg-red-200"><i class="fas fa-trash-alt"></i></button>`;
                    actions = roleBtn + deleteBtn;
                }
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="py-3 px-6 font-mono text-gray-600">${u.user_id}</td>
                        <td class="py-3 px-6 font-medium text-gray-800">${u.name}</td>
                        <td class="py-3 px-6 text-gray-500 capitalize">${u.role}</td>
                        <td class="py-3 px-6 text-right whitespace-nowrap">${actions}</td>
                    </tr>
                `;
            });
        }

        async function changeRole(id, role) {
            if(!confirm(`Are you sure you want to change this user's role to ${role}?`)) return;
            await fetch(`/api/admin/role`, { 
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id, role})
            });
            loadEmployees();
        }

        async function deleteUser(id) {
            if(!confirm("Are you sure you want to delete this employee?")) return;
            await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
            loadStats();
            loadEmployees();
        }

        async function loadAttendance() {
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            
            // To fetch data for filtering on the screen, we can just fetch all or date specific. 
            // In a real app we might pass date range, but here the UI filter logic was simpler before. Let's just use start_date.
            // For simplicity, we just fetch all and group by date.
            
            let url = '/api/admin/attendance';
            if(startDate) url += `?date=${startDate}`; // Quick filter for display

            const res = await fetch(url);
            const data = await res.json();
            
            const container = document.getElementById('attendance-container');
            container.innerHTML = '';

            for(const [date, records] of Object.entries(data)) {
                let html = `<div class="bg-white rounded-xl shadow overflow-hidden">
                    <div class="bg-indigo-50 border-b px-6 py-3">
                        <h3 class="font-bold text-lg text-indigo-800"><i class="fas fa-calendar-day mr-2"></i> Date: ${date}</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full text-left">
                            <thead class="bg-gray-50 text-gray-600 text-sm border-b">
                                <tr>
                                    <th class="py-3 px-6">ID</th>
                                    <th class="py-3 px-6">Name</th>
                                    <th class="py-3 px-6">Check In</th>
                                    <th class="py-3 px-6">Check Out</th>
                                    <th class="py-3 px-6">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 text-sm">
                `;
                
                records.forEach(r => {
                    const mapIn = (r.login_lat && r.login_lng) ? `<a href="https://maps.google.com/?q=${r.login_lat},${r.login_lng}" target="_blank" class="text-blue-500 hover:underline"><i class="fas fa-map-marker-alt"></i> Map</a>` : '';
                    const mapOut = (r.logout_lat && r.logout_lng) ? `<a href="https://maps.google.com/?q=${r.logout_lat},${r.logout_lng}" target="_blank" class="text-blue-500 hover:underline"><i class="fas fa-map-marker-alt"></i> Map</a>` : '';
                    const statusColor = r.status === 'green' ? 'text-green-600 bg-green-100' : 'text-rose-600 bg-rose-100';
                    const nameColor = r.status === 'green' ? 'text-green-600 font-bold' : 'text-red-600 font-bold';
                    const statusText = r.status === 'green' ? 'Active' : 'Completed';
                    
                    html += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="py-3 px-6 font-mono">${r.user_id}</td>
                        <td class="py-3 px-6 ${nameColor}">${r.name}</td>
                        <td class="py-3 px-6">
                            ${r.login_time || '-'} <br>
                            <span class="text-xs text-gray-500">${mapIn}</span>
                        </td>
                        <td class="py-3 px-6">
                            ${r.logout_time || '-'} <br>
                            <span class="text-xs text-gray-500">${mapOut}</span>
                        </td>
                        <td class="py-3 px-6">
                            <span class="px-2 py-1 rounded text-xs font-bold ${statusColor}">${statusText}</span>
                        </td>
                    </tr>`;
                });

                html += `</tbody></table></div></div>`;
                container.innerHTML += html;
            }
            
            if(Object.keys(data).length === 0) {
                container.innerHTML = '<div class="bg-white p-8 rounded-xl shadow text-center text-gray-500"><i class="fas fa-folder-open text-4xl mb-3 text-gray-300"></i><p>No records found.</p></div>';
            }
        }

        function exportExcel() {
            const start = document.getElementById('start-date').value;
            const end = document.getElementById('end-date').value;
            let url = '/api/admin/export?';
            if(start) url += `start_date=${start}&`;
            if(end) url += `end_date=${end}`;
            window.location.href = url;
        }

        loadDashboard();
    </script>
</body>
</html>
