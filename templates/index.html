<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance Portal</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
    <link rel="shortcut icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-blue-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-md border border-gray-100">
        <!-- Logo / Header -->
        <div class="text-center mb-6">
            <div class="bg-indigo-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl shadow-lg shadow-indigo-200">
                <i class="fas fa-fingerprint"></i>
            </div>
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">Attendance System</h1>
            <p class="text-gray-500 text-xs mt-1" id="section-subtitle">Employee Sign In Portal</p>
        </div>

        <!-- 1. Employee Login Section -->
        <div id="login-section">
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Your 6-Digit ID</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                        <i class="fas fa-id-badge"></i>
                    </span>
                    <input type="text" id="login-id" placeholder="e.g. 123456" class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-lg font-mono tracking-wider font-bold transition" maxlength="6">
                </div>
            </div>
            <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-200 hover:shadow-indigo-300 transition-all flex items-center justify-center">
                <i class="fas fa-sign-in-alt mr-2"></i> Employee Login
            </button>
            <div class="mt-5 text-center flex justify-between text-xs text-gray-500">
                <a href="#" onclick="showSection('register')" class="text-indigo-600 font-semibold hover:underline">New Account Request</a>
                <a href="#" onclick="showSection('admin')" class="text-gray-600 font-semibold hover:text-indigo-600 flex items-center"><i class="fas fa-user-shield mr-1"></i> Admin Portal</a>
            </div>
        </div>

        <!-- 2. Employee Registration Section (Rich Profile Info) -->
        <div id="register-section" class="hidden">
            <div class="space-y-3.5 max-h-[460px] overflow-y-auto pr-1">
                <!-- Profile Image Preview & Upload -->
                <div class="text-center">
                    <div class="relative inline-block">
                        <img id="avatar-preview" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff&size=128" class="w-20 h-20 rounded-full object-cover border-4 border-indigo-100 shadow-md mx-auto">
                        <label for="profile-image-input" class="absolute bottom-0 right-0 bg-indigo-600 text-white p-1.5 rounded-full cursor-pointer hover:bg-indigo-700 shadow">
                            <i class="fas fa-camera text-xs"></i>
                        </label>
                        <input type="file" id="profile-image-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                    </div>
                    <p class="text-[11px] text-gray-400 mt-1">Upload Profile Photo</p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Full Name *</label>
                    <input type="text" id="reg-name" placeholder="John Doe" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 text-sm focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Email Address</label>
                    <input type="email" id="reg-email" placeholder="john@example.com" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 text-sm focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">WhatsApp No *</label>
                        <input type="tel" id="reg-whatsapp" placeholder="+91 9876543210" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Date of Birth</label>
                        <input type="date" id="reg-dob" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 text-sm focus:outline-none">
                    </div>
                </div>
            </div>

            <button onclick="register()" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center">
                <i class="fas fa-paper-plane mr-2"></i> Submit Request
            </button>
            <p class="mt-4 text-center text-xs text-gray-500">Already have an ID? <a href="#" onclick="showSection('login')" class="text-indigo-600 font-semibold hover:underline">Back to Login</a></p>
        </div>

        <!-- 3. Admin Login Section (Password & Phone OTP) -->
        <div id="admin-section" class="hidden">
            <div id="admin-step-creds">
                <div class="mb-3.5">
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Admin ID / Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                            <i class="fas fa-user-shield"></i>
                        </span>
                        <input type="text" id="admin-user" placeholder="Enter Admin ID" class="w-full pl-10 pr-3.5 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 text-sm focus:outline-none">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="admin-pass" placeholder="Enter Admin Password" class="w-full pl-10 pr-3.5 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 text-sm focus:outline-none">
                    </div>
                </div>

                <button onclick="requestAdminOTP()" class="w-full bg-slate-800 hover:bg-black text-white font-bold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center">
                    <i class="fas fa-envelope mr-2"></i> Verify & Send OTP to Email
                </button>
            </div>

            <!-- OTP Input Step -->
            <div id="admin-step-otp" class="hidden text-center">
                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-4">
                    <i class="fas fa-envelope-open-text text-indigo-600 text-2xl mb-1"></i>
                    <p class="text-xs text-gray-600">Enter the 6-digit OTP sent to registered email</p>
                    <p class="text-xs font-bold text-indigo-700 mt-0.5">prempriyomanta@gmail.com</p>
                </div>
                <input type="text" id="admin-otp-input" placeholder="Enter 6-Digit OTP" maxlength="6" class="w-full text-center py-3 text-2xl font-mono tracking-widest font-black border-2 border-indigo-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none mb-4">
                <button onclick="verifyAdminOTP()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all">
                    <i class="fas fa-unlock-alt mr-2"></i> Unlock Admin Panel
                </button>
                <button onclick="backToAdminCreds()" class="w-full mt-2 text-xs text-gray-500 hover:underline">Change Credentials</button>
            </div>

            <p class="mt-4 text-center text-xs text-gray-500"><a href="#" onclick="showSection('login')" class="text-indigo-600 font-semibold hover:underline"><i class="fas fa-arrow-left mr-1"></i> Employee Portal</a></p>
        </div>

        <!-- Notification Message -->
        <div id="message-box" class="mt-4 hidden p-3 rounded-xl text-xs text-center font-semibold"></div>
    </div>

    <script>
        let base64ProfileImage = '';

        function showSection(section) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('admin-section').classList.add('hidden');
            hideMessage();

            if (section === 'login') {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('section-subtitle').innerText = 'Employee Sign In Portal';
            } else if (section === 'register') {
                document.getElementById('register-section').classList.remove('hidden');
                document.getElementById('section-subtitle').innerText = 'Request New Account';
            } else if (section === 'admin') {
                document.getElementById('admin-section').classList.remove('hidden');
                document.getElementById('section-subtitle').innerText = 'Administrator Secure Access';
                backToAdminCreds();
            }
        }

        function showMessage(msg, isSuccess = false) {
            const box = document.getElementById('message-box');
            box.innerText = msg;
            box.className = `mt-4 p-3 rounded-xl text-xs text-center font-semibold ${isSuccess ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`;
            box.classList.remove('hidden');
        }

        function hideMessage() {
            document.getElementById('message-box').classList.add('hidden');
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) {
                alert('Image must be less than 2MB');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(evt) {
                base64ProfileImage = evt.target.result;
                document.getElementById('avatar-preview').src = base64ProfileImage;
            };
            reader.readAsDataURL(file);
        }

        async function register() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const whatsapp = document.getElementById('reg-whatsapp').value.trim();
            const dob = document.getElementById('reg-dob').value;

            if (!name) return showMessage('Please enter your full name');
            if (!whatsapp) return showMessage('Please enter your WhatsApp number');

            showMessage('Submitting request...', true);
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name,
                        email,
                        whatsapp,
                        dob,
                        profile_image: base64ProfileImage
                    })
                });
                const data = await res.json();
                if (data.error) {
                    showMessage(data.error);
                } else {
                    showMessage(data.message, true);
                    if (data.approved) {
                        document.getElementById('login-id').value = data.user_id;
                    }
                    setTimeout(() => showSection('login'), 3500);
                }
            } catch (e) {
                showMessage('Server connection error. Please try again.');
            }
        }

        async function login() {
            const userId = document.getElementById('login-id').value.trim();
            if (userId.length !== 6) return showMessage('Please enter a valid 6-digit ID');

            showMessage('Capturing location and authenticating...', true);

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    await doLogin(userId, position.coords.latitude, position.coords.longitude);
                },
                async (error) => {
                    console.warn("Location error:", error);
                    await doLogin(userId, null, null);
                },
                { enableHighAccuracy: true, timeout: 6000 }
            );
        }

        async function doLogin(user_id, lat, lng) {
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id, lat, lng})
                });
                const data = await res.json();
                if (data.error) {
                    showMessage(data.error);
                } else {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    if (data.user.role === 'owner' || data.user.role === 'editor') {
                        const wantAdmin = confirm("Login Successful! Click OK to go to Admin Panel, or Cancel for Employee Dashboard.");
                        if (wantAdmin) {
                            window.location.href = '/admin';
                            return;
                        }
                    }
                    window.location.href = '/dashboard';
                }
            } catch (e) {
                showMessage('Server connection error.');
            }
        }

        // Admin OTP Handlers
        async function requestAdminOTP() {
            const username = document.getElementById('admin-user').value.trim();
            const password = document.getElementById('admin-pass').value.trim();
            if (!username || !password) return showMessage('Enter Admin Username & Password');

            showMessage('Validating credentials...', true);
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                if (data.error) {
                    showMessage(data.error);
                } else if (data.direct_login) {
                    // Sub-admin / Manager direct login to dashboard
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showMessage('Manager Login Successful! Opening Admin Dashboard...', true);
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 800);
                } else {
                    document.getElementById('admin-step-creds').classList.add('hidden');
                    document.getElementById('admin-step-otp').classList.remove('hidden');
                    document.getElementById('admin-otp-input').value = '';
                    showMessage(data.message || 'A 6-digit OTP has been sent to prempriyomanta@gmail.com!', true);
                }
            } catch (e) {
                showMessage('Server connection error.');
            }
        }

        function backToAdminCreds() {
            document.getElementById('admin-step-creds').classList.remove('hidden');
            document.getElementById('admin-step-otp').classList.add('hidden');
            document.getElementById('admin-otp-input').value = '';
            hideMessage();
        }

        async function verifyAdminOTP() {
            const username = document.getElementById('admin-user').value.trim();
            const otp = document.getElementById('admin-otp-input').value.trim();
            if (!otp) return showMessage('Please enter the 6-digit OTP');

            try {
                const res = await fetch('/api/admin/verify-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, otp})
                });
                const data = await res.json();
                if (data.error) {
                    showMessage(data.error);
                } else {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showMessage('Access Granted! Redirecting to Admin Dashboard...', true);
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 1000);
                }
            } catch (e) {
                showMessage('Verification error.');
            }
        }
    </script>
</body>
</html>
