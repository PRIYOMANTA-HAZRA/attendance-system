<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Rounded Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="#a5b4fc" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Badge / ID Card Base -->
  <rect x="15" y="16" width="34" height="36" rx="6" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="1.8"/>

  <!-- Top Badge Clip / Notch -->
  <rect x="27" y="12" width="10" height="4" rx="2" fill="#c7d2fe"/>

  <!-- Checkmark Emblem Badge -->
  <circle cx="32" cy="34" r="12" fill="url(#checkGrad)" filter="url(#shadow)"/>
  <path d="M26 34 L30 38 L38 29" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pulse Status Dot (Green Live Indicator) -->
  <circle cx="47" cy="17" r="4.5" fill="#10b981"/>
  <circle cx="47" cy="17" r="6" fill="none" stroke="#6ee7b7" stroke-width="1" opacity="0.7"/>
</svg>
